name: Crear APK Grabador Gamer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Generar Proyecto Completo y Compilar
        run: |
          mkdir -p app/src/main/java/com/gamer/recorder
          
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GamerRecorder"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.gamer.recorder'
              compileSdk 34
              defaultConfig {
                  applicationId "com.gamer.recorder"
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="GamerRec + Discord"
                  android:icon="@android:drawable/presence_video_online"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RecorderService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection|microphone" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/gamer/recorder/MainActivity.kt
          package com.gamer.recorder

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.webkit.*
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var projectionManager: MediaProjectionManager
              private val REQ_CODE = 1001

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  ActivityCompat.requestPermissions(
                      this,
                      arrayOf(
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.MODIFY_AUDIO_SETTINGS,
                          Manifest.permission.POST_NOTIFICATIONS
                      ),
                      101
                  )

                  projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#1E1F22"))
                  }

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }

                  val btnStart = Button(this).apply {
                      text = "🔴 GRABAR PARTIDA + VOZ"
                      setBackgroundColor(Color.parseColor("#DA373C"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          startActivityForResult(projectionManager.createScreenCaptureIntent(), REQ_CODE)
                      }
                  }

                  val btnStop = Button(this).apply {
                      text = "⏹️ DETENER Y GUARDAR"
                      setBackgroundColor(Color.parseColor("#2B2D31"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          val stopIntent = Intent(this@MainActivity, RecorderService::class.java).apply {
                              action = "STOP_REC"
                          }
                          startService(stopIntent)
                          Toast.makeText(this@MainActivity, "Video guardado en Películas (Galería)", Toast.LENGTH_LONG).show()
                      }
                  }

                  topBar.addView(btnStart, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  topBar.addView(btnStop, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))

                  val discordWeb = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.mediaPlaybackRequiresUserGesture = false
                      settings.userAgentString = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
                      webChromeClient = object : WebChromeClient() {
                          override fun onPermissionRequest(request: PermissionRequest?) {
                              request?.grant(request.resources)
                          }
                      }
                      webViewClient = WebViewClient()
                      loadUrl("https://discord.com/app")
                  }

                  layout.addView(topBar, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  layout.addView(discordWeb, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.MATCH_PARENT))

                  setContentView(layout)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_CODE && resultCode == Activity.RESULT_OK && data != null) {
                      val serviceIntent = Intent(this, RecorderService::class.java).apply {
                          putExtra("CODE", resultCode)
                          putExtra("DATA", data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent)
                      } else {
                          startService(serviceIntent)
                      }
                      Toast.makeText(this, "¡Grabando! Abre Free Fire ahora", Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/gamer/recorder/RecorderService.kt
          package com.gamer.recorder

          import android.app.*
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.*
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.provider.MediaStore
          import androidx.core.app.NotificationCompat
          import java.io.File
          import java.nio.ByteBuffer
          import java.util.concurrent.atomic.AtomicBoolean
          import kotlin.concurrent.thread

          class RecorderService : Service() {
              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var mediaMuxer: MediaMuxer? = null
              private var videoEncoder: MediaCodec? = null
              private var audioEncoder: MediaCodec? = null
              private val isRecording = AtomicBoolean(false)
              private var outFile: File? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP_REC") {
                      stopRecording()
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  startNotif()
                  val code = intent?.getIntExtra("CODE", Activity.RESULT_CANCELED) ?: Activity.RESULT_CANCELED
                  val data: Intent? = intent?.getParcelableExtra("DATA")

                  if (code == Activity.RESULT_OK && data != null) {
                      val mgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      projection = mgr.getMediaProjection(code, data)
                      startMixedRecording()
                  }
                  return START_STICKY
              }

              private fun startMixedRecording() {
                  outFile = File(getExternalFilesDir(Environment.DIRECTORY_MOVIES), "FF_${System.currentTimeMillis()}.mp4")
                  val width = 720
                  val height = 1280

                  val vFormat = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, width, height).apply {
                      setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface)
                      setInteger(MediaFormat.KEY_BIT_RATE, 6000000)
                      setInteger(MediaFormat.KEY_FRAME_RATE, 60)
                      setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                  }
                  videoEncoder = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC).apply {
                      configure(vFormat, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                  }
                  val inputSurface = videoEncoder!!.createInputSurface()
                  videoEncoder!!.start()

                  virtualDisplay = projection?.createVirtualDisplay(
                      "FFRec", width, height, resources.displayMetrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, inputSurface, null, null
                  )

                  val sampleRate = 44100
                  val aFormat = MediaFormat.createAudioFormat(MediaFormat.MIMETYPE_AUDIO_AAC, sampleRate, 1).apply {
                      setInteger(MediaFormat.KEY_AAC_PROFILE, MediaCodecInfo.CodecProfileLevel.AACObjectLC)
                      setInteger(MediaFormat.KEY_BIT_RATE, 128000)
                  }
                  audioEncoder = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_AUDIO_AAC).apply {
                      configure(aFormat, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                      start()
                  }

                  mediaMuxer = MediaMuxer(outFile!!.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                  isRecording.set(true)

                  thread { runMuxerLoop(sampleRate) }
              }

              private fun runMuxerLoop(sampleRate: Int) {
                  val bufSize = AudioRecord.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT) * 2
                  val audioFormat = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(sampleRate)
                      .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                      .build()

                  val playbackConfig = AudioPlaybackCaptureConfiguration.Builder(projection!!)
                      .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                      .addMatchingUsage(AudioAttributes.USAGE_GAME)
                      .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                      .build()
                  val internalRec = AudioRecord.Builder()
                      .setAudioFormat(audioFormat)
                      .setBufferSizeInBytes(bufSize)
                      .setAudioPlaybackCaptureConfig(playbackConfig)
                      .build()

                  val micRec = AudioRecord(MediaRecorder.AudioSource.VOICE_COMMUNICATION, sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, bufSize)

                  internalRec.startRecording()
                  micRec.startRecording()

                  val inBuf = ShortArray(1024)
                  val micBuf = ShortArray(1024)
                  val mixBuf = ByteArray(2048)

                  var vTrack = -1
                  var aTrack = -1
                  var muxerStarted = false
                  val vInfo = MediaCodec.BufferInfo()
                  val aInfo = MediaCodec.BufferInfo()
                  val startTimeNs = System.nanoTime()

                  while (isRecording.get()) {
                      val r1 = internalRec.read(inBuf, 0, 1024)
                      val r2 = micRec.read(micBuf, 0, 1024)
                      val samples = maxOf(r1, r2, 0)
                      if (samples > 0) {
                          for (i in 0 until samples) {
                              val s1 = if (i < r1) inBuf[i].toInt() else 0
                              val s2 = if (i < r2) micBuf[i].toInt() else 0
                              val mixed = (s1 + s2).coerceIn(Short.MIN_VALUE.toInt(), Short.MAX_VALUE.toInt()).toShort()
                              mixBuf[i * 2] = (mixed.toInt() and 0xFF).toByte()
                              mixBuf[i * 2 + 1] = ((mixed.toInt() shr 8) and 0xFF).toByte()
                          }
                          val inIdx = audioEncoder!!.dequeueInputBuffer(0)
                          if (inIdx >= 0) {
                              val ib = audioEncoder!!.getInputBuffer(inIdx)!!
                              ib.clear()
                              ib.put(mixBuf, 0, samples * 2)
                              val ptsUs = (System.nanoTime() - startTimeNs) / 1000
                              audioEncoder!!.queueInputBuffer(inIdx, 0, samples * 2, ptsUs, 0)
                          }
                      }

                      while (true) {
                          val outIdx = videoEncoder!!.dequeueOutputBuffer(vInfo, 0)
                          if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              vTrack = mediaMuxer!!.addTrack(videoEncoder!!.outputFormat)
                              if (vTrack != -1 && aTrack != -1 && !muxerStarted) {
                                  mediaMuxer!!.start()
                                  muxerStarted = true
                              }
                          } else if (outIdx >= 0) {
                              val ob = videoEncoder!!.getOutputBuffer(outIdx)!!
                              if (muxerStarted && vInfo.size > 0) {
                                  mediaMuxer!!.writeSampleData(vTrack, ob, vInfo)
                              }
                              videoEncoder!!.releaseOutputBuffer(outIdx, false)
                          } else break
                      }

                      while (true) {
                          val outIdx = audioEncoder!!.dequeueOutputBuffer(aInfo, 0)
                          if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              aTrack = mediaMuxer!!.addTrack(audioEncoder!!.outputFormat)
                              if (vTrack != -1 && aTrack != -1 && !muxerStarted) {
                                  mediaMuxer!!.start()
                                  muxerStarted = true
                              }
                          } else if (outIdx >= 0) {
                              val ob = audioEncoder!!.getOutputBuffer(outIdx)!!
                              if (muxerStarted && aInfo.size > 0) {
                                  mediaMuxer!!.writeSampleData(aTrack, ob, aInfo)
                              }
                              audioEncoder!!.releaseOutputBuffer(outIdx, false)
                          } else break
                      }
                  }

                  try {
                      internalRec.stop(); internalRec.release()
                      micRec.stop(); micRec.release()
                      videoEncoder?.stop(); videoEncoder?.release()
                      audioEncoder?.stop(); audioEncoder?.release()
                      if (muxerStarted) mediaMuxer?.stop()
                      mediaMuxer?.release()
                      virtualDisplay?.release()
                      projection?.stop()
                      saveToGallery()
                  } catch (e: Exception) { e.printStackTrace() }
              }

              private fun saveToGallery() {
                  val file = outFile ?: return
                  val values = ContentValues().apply {
                      put(MediaStore.Video.Media.DISPLAY_NAME, file.name)
                      put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                      put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES)
                  }
                  val uri = contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values)
                  if (uri != null) {
                      contentResolver.openOutputStream(uri)?.use { out ->
                          file.inputStream().use { it.copyTo(out) }
                      }
                      file.delete()
                  }
              }

              private fun stopRecording() {
                  isRecording.set(false)
              }

              private fun startNotif() {
                  val chId = "RecGamerChannel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(chId, "Grabador Free Fire", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  }
                  val stopIntent = Intent(this, RecorderService::class.java).apply { action = "STOP_REC" }
                  val pi = PendingIntent.getService(this, 0, stopIntent, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val notif = NotificationCompat.Builder(this, chId)
                      .setContentTitle("Grabando Free Fire + Discord + Voz")
                      .setContentText("Toca Detener cuando termines tu partida")
                      .setSmallIcon(android.R.drawable.presence_video_online)
                      .addAction(android.R.drawable.ic_media_pause, "Detener", pi)
                      .setOngoing(true)
                      .build()
                  startForeground(1, notif)
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug

      - name: Subir APK Listo
        uses: actions/upload-artifact@v4
        with:
          name: APK-GamerRec-Discord
          path: app/build/outputs/apk/debug/app-debug.apk
