name: Crear APK Grabador Gamer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Crear Archivos y Compilar APK
        run: |
          mkdir -p app/src/main/java/com/gamer/recorder
          printf 'pluginManagement {\n repositories {\n google()\n mavenCentral()\n gradlePluginPortal()\n }\n}\ndependencyResolutionManagement {\n repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n repositories {\n google()\n mavenCentral()\n }\n}\nrootProject.name = "GamerRecorder"\ninclude ":app"\n' > settings.gradle
          printf 'plugins {\n id "com.android.application" version "8.2.0" apply false\n id "org.jetbrains.kotlin.android" version "1.9.20" apply false\n}\n' > build.gradle
          printf 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nkotlin.code.style=official\n' > gradle.properties
          printf 'plugins {\n id "com.android.application"\n id "org.jetbrains.kotlin.android"\n}\nandroid {\n namespace "com.gamer.recorder"\n compileSdk 34\n defaultConfig {\n applicationId "com.gamer.recorder"\n minSdk 29\n targetSdk 34\n versionCode 1\n versionName "1.0"\n }\n compileOptions {\n sourceCompatibility JavaVersion.VERSION_17\n targetCompatibility JavaVersion.VERSION_17\n }\n kotlinOptions {\n jvmTarget = "17"\n }\n}\ndependencies {\n implementation "androidx.core:core-ktx:1.12.0"\n implementation "androidx.appcompat:appcompat:1.6.1"\n}\n' > app/build.gradle
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n <uses-permission android:name="android.permission.INTERNET" />\n <uses-permission android:name="android.permission.RECORD_AUDIO" />\n <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />\n <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n <application android:allowBackup="true" android:label="GamerRec + Discord" android:icon="@android:drawable/presence_video_online" android:theme="@style/Theme.AppCompat.NoActionBar">\n <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">\n <intent-filter>\n <action android:name="android.intent.action.MAIN" />\n <category android:name="android.intent.category.LAUNCHER" />\n </intent-filter>\n </activity>\n <service android:name=".RecorderService" android:enabled="true" android:exported="false" android:foregroundServiceType="mediaProjection|microphone" />\n </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml
          printf 'package com.gamer.recorder\nimport android.Manifest\nimport android.app.Activity\nimport android.content.Context\nimport android.content.Intent\nimport android.graphics.Color\nimport android.media.projection.MediaProjectionManager\nimport android.os.Build\nimport android.os.Bundle\nimport android.webkit.*\nimport android.widget.Button\nimport android.widget.LinearLayout\nimport android.widget.Toast\nimport androidx.appcompat.app.AppCompatActivity\nimport androidx.core.app.ActivityCompat\nclass MainActivity : AppCompatActivity() {\n private lateinit var projectionManager: MediaProjectionManager\n private val REQ_CODE = 1001\n override fun onCreate(savedInstanceState: Bundle?) {\n super.onCreate(savedInstanceState)\n ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.MODIFY_AUDIO_SETTINGS, Manifest.permission.POST_NOTIFICATIONS), 101)\n projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager\n val layout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(Color.parseColor("#1E1F22")) }\n val topBar = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }\n val btnStart = Button(this).apply {\n text = "GRABAR PARTIDA + VOZ"\n setBackgroundColor(Color.parseColor("#DA373C"))\n setTextColor(Color.WHITE)\n setOnClickListener { startActivityForResult(projectionManager.createScreenCaptureIntent(), REQ_CODE) }\n }\n val btnStop = Button(this).apply {\n text = "DETENER Y GUARDAR"\n setBackgroundColor(Color.parseColor("#2B2D31"))\n setTextColor(Color.WHITE)\n setOnClickListener {\n startService(Intent(this@MainActivity, RecorderService::class.java).apply { action = "STOP_REC" })\n Toast.makeText(this@MainActivity, "Video guardado en Galeria", Toast.LENGTH_LONG).show()\n }\n }\n topBar.addView(btnStart, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))\n topBar.addView(btnStop, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))\n val discordWeb = WebView(this).apply {\n settings.javaScriptEnabled = true\n settings.domStorageEnabled = true\n settings.mediaPlaybackRequiresUserGesture = false\n settings.userAgentString = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"\n webChromeClient = object : WebChromeClient() {\n override fun onPermissionRequest(request: PermissionRequest?) { request?.grant(request.resources) }\n }\n webViewClient = WebViewClient()\n loadUrl("https://discord.com/app")\n }\n layout.addView(topBar, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))\n layout.addView(discordWeb, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.MATCH_PARENT))\n setContentView(layout)\n }\n override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {\n super.onActivityResult(requestCode, resultCode, data)\n if (requestCode == REQ_CODE && resultCode == Activity.RESULT_OK && data != null) {\n val s = Intent(this, RecorderService::class.java).apply { putExtra("CODE", resultCode); putExtra("DATA", data) }\n if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(s) else startService(s)\n Toast.makeText(this, "Grabando! Abre Free Fire ahora", Toast.LENGTH_LONG).show()\n }\n }\n}\n' > app/src/main/java/com/gamer/recorder/MainActivity.kt
          printf 'package com.gamer.recorder\nimport android.app.*\nimport android.content.ContentValues\nimport android.content.Context\nimport android.content.Intent\nimport android.hardware.display.DisplayManager\nimport android.hardware.display.VirtualDisplay\nimport android.media.*\nimport android.media.projection.MediaProjection\nimport android.media.projection.MediaProjectionManager\nimport android.os.*\nimport android.provider.MediaStore\nimport androidx.core.app.NotificationCompat\nimport java.io.File\nimport java.util.concurrent.atomic.AtomicBoolean\nimport kotlin.concurrent.thread\nclass RecorderService : Service() {\n private var projection: MediaProjection? = null\n private var virtualDisplay: VirtualDisplay? = null\n private var mediaMuxer: MediaMuxer? = null\n private var videoEncoder: MediaCodec? = null\n private var audioEncoder: MediaCodec? = null\n private val isRecording = AtomicBoolean(false)\n private var outFile: File? = null\n override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {\n if (intent?.action == "STOP_REC") { isRecording.set(false); stopSelf(); return START_NOT_STICKY }\n startNotif()\n val code = intent?.getIntExtra("CODE", Activity.RESULT_CANCELED) ?: Activity.RESULT_CANCELED\n val data: Intent? = intent?.getParcelableExtra("DATA")\n if (code == Activity.RESULT_OK && data != null) {\n val mgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager\n projection = mgr.getMediaProjection(code, data)\n startMixedRecording()\n }\n return START_STICKY\n }\n private fun startMixedRecording() {\n outFile = File(getExternalFilesDir(Environment.DIRECTORY_MOVIES), "FF_${System.currentTimeMillis()}.mp4")\n val vFormat = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, 720, 1280).apply {\n setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface)\n setInteger(MediaFormat.KEY_BIT_RATE, 6000000)\n setInteger(MediaFormat.KEY_FRAME_RATE, 60)\n setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)\n }\n videoEncoder = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC).apply { configure(vFormat, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE) }\n val inputSurface = videoEncoder!!.createInputSurface()\n videoEncoder!!.start()\n virtualDisplay = projection?.createVirtualDisplay("FFRec", 720, 1280, resources.displayMetrics.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, inputSurface, null, null)\n val aFormat = MediaFormat.createAudioFormat(MediaFormat.MIMETYPE_AUDIO_AAC, 44100, 1).apply {\n setInteger(MediaFormat.KEY_AAC_PROFILE, MediaCodecInfo.CodecProfileLevel.AACObjectLC)\n setInteger(MediaFormat.KEY_BIT_RATE, 128000)\n }\n audioEncoder = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_AUDIO_AAC).apply { configure(aFormat, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE); start() }\n mediaMuxer = MediaMuxer(outFile!!.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)\n isRecording.set(true)\n thread { runMuxerLoop(44100) }\n }\n private fun runMuxerLoop(sampleRate: Int) {\n val bufSize = AudioRecord.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT) * 2\n val audioFormat = AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(sampleRate).setChannelMask(AudioFormat.CHANNEL_IN_MONO).build()\n val playbackConfig = AudioPlaybackCaptureConfiguration.Builder(projection!!).addMatchingUsage(AudioAttributes.USAGE_MEDIA).addMatchingUsage(AudioAttributes.USAGE_GAME).addMatchingUsage(AudioAttributes.USAGE_UNKNOWN).build()\n val internalRec = AudioRecord.Builder().setAudioFormat(audioFormat).setBufferSizeInBytes(bufSize).setAudioPlaybackCaptureConfig(playbackConfig).build()\n val micRec = AudioRecord(MediaRecorder.AudioSource.VOICE_COMMUNICATION, sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, bufSize)\n internalRec.startRecording(); micRec.startRecording()\n val inBuf = ShortArray(1024); val micBuf = ShortArray(1024); val mixBuf = ByteArray(2048)\n var vTrack = -1; var aTrack = -1; var muxerStarted = false\n val vInfo = MediaCodec.BufferInfo(); val aInfo = MediaCodec.BufferInfo()\n val startTimeNs = System.nanoTime()\n while (isRecording.get()) {\n val r1 = internalRec.read(inBuf, 0, 1024); val r2 = micRec.read(micBuf, 0, 1024)\n val samples = maxOf(r1, r2, 0)\n if (samples > 0) {\n for (i in 0 until samples) {\n val s1 = if (i < r1) inBuf[i].toInt() else 0\n val s2 = if (i < r2) micBuf[i].toInt() else 0\n val mixed = (s1 + s2).coerceIn(Short.MIN_VALUE.toInt(), Short.MAX_VALUE.toInt()).toShort()\n mixBuf[i * 2] = (mixed.toInt() and 0xFF).toByte()\n mixBuf[i * 2 + 1] = ((mixed.toInt() shr 8) and 0xFF).toByte()\n }\n val inIdx = audioEncoder!!.dequeueInputBuffer(0)\n if (inIdx >= 0) {\n val ib = audioEncoder!!.getInputBuffer(inIdx)!!\n ib.clear(); ib.put(mixBuf, 0, samples * 2)\n audioEncoder!!.queueInputBuffer(inIdx, 0, samples * 2, (System.nanoTime() - startTimeNs) / 1000, 0)\n }\n }\n while (true) {\n val outIdx = videoEncoder!!.dequeueOutputBuffer(vInfo, 0)\n if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {\n vTrack = mediaMuxer!!.addTrack(videoEncoder!!.outputFormat)\n if (vTrack != -1 && aTrack != -1 && !muxerStarted) { mediaMuxer!!.start(); muxerStarted = true }\n } else if (outIdx >= 0) {\n val ob = videoEncoder!!.getOutputBuffer(outIdx)!!\n if (muxerStarted && vInfo.size > 0) mediaMuxer!!.writeSampleData(vTrack, ob, vInfo)\n videoEncoder!!.releaseOutputBuffer(outIdx, false)\n } else break\n }\n while (true) {\n val outIdx = audioEncoder!!.dequeueOutputBuffer(aInfo, 0)\n if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {\n aTrack = mediaMuxer!!.addTrack(audioEncoder!!.outputFormat)\n if (vTrack != -1 && aTrack != -1 && !muxerStarted) { mediaMuxer!!.start(); muxerStarted = true }\n } else if (outIdx >= 0) {\n val ob = audioEncoder!!.getOutputBuffer(outIdx)!!\n if (muxerStarted && aInfo.size > 0) mediaMuxer!!.writeSampleData(aTrack, ob, aInfo)\n audioEncoder!!.releaseOutputBuffer(outIdx, false)\n } else break\n }\n }\n try {\n internalRec.stop(); internalRec.release(); micRec.stop(); micRec.release()\n videoEncoder?.stop(); videoEncoder?.release(); audioEncoder?.stop(); audioEncoder?.release()\n if (muxerStarted) mediaMuxer?.stop(); mediaMuxer?.release()\n virtualDisplay?.release(); projection?.stop(); saveToGallery()\n } catch (e: Exception) { e.printStackTrace() }\n }\n private fun saveToGallery() {\n val file = outFile ?: return\n val values = ContentValues().apply {\n put(MediaStore.Video.Media.DISPLAY_NAME, file.name)\n put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")\n put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES)\n }\n val uri = contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values)\n if (uri != null) { contentResolver.openOutputStream(uri)?.use { out -> file.inputStream().use { it.copyTo(out) } }; file.delete() }\n }\n private fun startNotif() {\n val chId = "RecGamerChannel"\n if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n val ch = NotificationChannel(chId, "Grabador Free Fire", NotificationManager.IMPORTANCE_LOW)\n getSystemService(NotificationManager::class.java).createNotificationChannel(ch)\n }\n val stopIntent = Intent(this, RecorderService::class.java).apply { action = "STOP_REC" }\n val pi = PendingIntent.getService(this, 0, stopIntent, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)\n val notif = NotificationCompat.Builder(this, chId).setContentTitle("Grabando Free Fire + Discord + Voz").setContentText("Toca Detener cuando termines").setSmallIcon(android.R.drawable.presence_video_online).addAction(android.R.drawable.ic_media_pause, "Detener", pi).setOngoing(true).build()\n startForeground(1, notif)\n }\n override fun onBind(intent: Intent?): IBinder? = null\n}\n' > app/src/main/java/com/gamer/recorder/RecorderService.kt
          gradle assembleDebug

      - name: Subir APK Listo
        uses: actions/upload-artifact@v4
        with:
          name: APK-GamerRec-Discord
          path: app/build/outputs/apk/debug/app-debug.apk
